<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>児童画面 見本</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E8EEE6;font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Meiryo',sans-serif;padding:18px 12px;color:#3a3a35}
.col{margin:0 auto}
.phone{min-height:640px}
.demo{display:flex;flex-direction:column;align-items:center;gap:8px}
.demoLabel{font-size:13px;color:var(--mute);text-align:center}
.col{width:380px;max-width:100%}
.phone{border-radius:30px;padding:16px 14px 20px;box-shadow:0 8px 26px rgba(0,0,0,.18);background:linear-gradient(180deg,#FFF6DD,#FCE2C8);color:#3a3a35}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ttl{font-weight:900;font-size:16px}
.stars{background:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:13px;color:#b8860b;box-shadow:0 2px 6px rgba(0,0,0,.08)}
#room{position:relative;width:100%;height:300px;border-radius:22px;overflow:hidden;box-shadow:inset 0 0 0 4px rgba(255,255,255,.7),0 4px 10px rgba(0,0,0,.1);background:linear-gradient(180deg,#FFEFC9 0 56%,#E0B27A 56% 100%);touch-action:none}
#room:before{content:"";position:absolute;left:0;right:0;top:56%;height:4px;background:rgba(160,110,60,.25)}
.it{position:absolute;user-select:none}
.it svg{width:100%;height:auto;display:block}
.edit .it,.edit .ch{cursor:grab;outline:2px dashed rgba(232,115,74,.8);outline-offset:3px;border-radius:10px}
.ch{position:absolute;width:84px;translate:-50% -100%;user-select:none;cursor:pointer}
.ch .in{transform-origin:50% 100%}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.walk .bodyg{animation:bob .38s ease-in-out infinite}
.walk .fl{animation:step .38s ease-in-out infinite}
.walk .fr{animation:step .38s ease-in-out infinite reverse}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes step{50%{transform:translateY(-5px)}}
.idle .bodyg{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-1.2px)}}
.sleep .eyes{animation:none;transform:scaleY(.12)}
.sleep .bodyg{animation:breathe 4s ease-in-out infinite}
.jump .in{animation:jump .6s ease-out}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-26px) scale(1.05,.95)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.say-b{position:absolute;left:50%;bottom:100%;translate:-50% -2px;background:#fff;color:#3a3a35;border-radius:12px;padding:4px 9px;font-size:11px;font-weight:900;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:none;animation:fade 2.6s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(4px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.z{position:absolute;left:62%;top:-4px;font-size:16px;font-weight:900;color:#6b7fb5;animation:zz 2s infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-12px)}}
.heart{position:absolute;font-size:18px;pointer-events:none;animation:hf 1.2s forwards}
@keyframes hf{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.pk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.pk div{background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;text-align:center;font-size:10px;font-weight:900}
.pk div.on{outline:3px solid #E8734A}
.pk svg{width:100%;height:auto;display:block}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:16px;padding:10px;font:inherit;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);background:#fff;color:#C24F28}
.btn.on{background:#E8734A;color:#fff}
.hint{font-size:12px;font-weight:700;color:#8a6a2b;margin-top:8px;text-align:center}
@media(prefers-reduced-motion:reduce){.walk .bodyg,.walk .fl,.walk .fr,.idle .bodyg{animation:none}}

.hello{font-size:12px;font-weight:700;color:#8a6a2b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{border-radius:22px;padding:12px 6px 10px;text-align:center;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.10);cursor:pointer;transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.tile .ic{font-size:34px;line-height:1.1}.tile .nm{font-size:17px;font-weight:900}.tile .st{font-size:11px;font-weight:700;opacity:.8}
.badge{position:absolute;top:-8px;right:-4px;background:#FF5A5F;color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:2px 9px;animation:wig 1.6s infinite;box-shadow:0 2px 5px rgba(0,0,0,.2)}
@keyframes wig{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.pk[hidden]{display:none}
.pk[hidden]{display:none}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrapx{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-start}
.side{width:230px;max-width:100%;font-size:12px;line-height:1.7;color:#5d6556}
.side h3{font-size:13px;margin:0 0 6px}
.side button{display:block;width:100%;margin-bottom:8px;border:0;border-radius:12px;background:#fff;padding:9px 10px;font:inherit;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1);text-align:left}
.phone{min-height:650px;position:relative}
.btn.sm{flex:none;padding:6px 10px;font-size:12px}
.card{background:#fff;border-radius:20px;padding:12px;margin-top:10px;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.lbl{font-size:12px;font-weight:900;color:#C24F28;margin-bottom:4px}
.row{display:flex;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px dashed #eadfc9;font-size:13px;font-weight:700}
.row:last-child{border:0}
.row.go{cursor:pointer}.row.go:hover{background:#FFF6EE;border-radius:10px}
.ck{width:26px;height:26px;border-radius:50%;background:#E8734A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.ck.no{background:#fff;border:2px dashed #F3A78A;color:#E8734A}
.tg{margin-left:auto;font-size:10px;border-radius:999px;padding:2px 9px;background:#FFE0D2;color:#C24F28}
.tg.ok{background:#DFF3DC;color:#3d7a35}
.sel{display:flex;gap:6px;margin-top:6px}
.sel span{flex:1;text-align:center;border-radius:12px;background:#FFF1E6;padding:8px 0;font-size:20px;font-weight:900;cursor:pointer}
.sel span.on{background:#E8734A;color:#fff}
textarea{width:100%;min-height:96px;border:2px solid #F3E2BC;background:#FFFBF0;border-radius:14px;padding:9px;font:inherit;font-size:14px;line-height:1.6;resize:vertical;color:#3a3a35}
.center{text-align:center}
.big{font-size:22px;font-weight:900;color:#C24F28;margin:6px 0}
.pop{display:inline-block;font-size:60px;animation:popin .8s}
.pop svg{width:130px}
@keyframes popin{0%{scale:.3;opacity:0}70%{scale:1.15}100%{scale:1;opacity:1}}
.it.new{animation:popin .9s .2s both}
.full{width:100%;margin-top:12px;flex:none}
.b2{background:#E8734A;color:#fff}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.theme{border-radius:18px;padding:12px 6px;font-weight:900;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.12);cursor:pointer}
.theme{text-align:center}.theme .e{font-size:32px;display:block}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.cg div{background:#fff;border-radius:18px;padding:8px 4px;text-align:center;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.cg div.on{outline:3px solid #E8734A}
.cg svg{width:100%;display:block}
.toast{position:absolute;left:50%;bottom:18px;translate:-50% 0;background:rgba(60,50,40,.9);color:#fff;border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;z-index:99;white-space:nowrap}
.plus{font-size:30px;font-weight:900;color:#b8860b;animation:popin .6s}
.dragon .it,.dragon .ch{cursor:grab;touch-action:none}.dragging{cursor:grabbing!important;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28))}</style>

<div class="wrapx">
<div class="col"><div class="phone" id="ph"></div></div>
<div class="side"><h3>見本の操作(本番にはありません)</h3>
<button data-d="reset">↺ はじめから(星0・1ひき)</button>
<button data-d="star">⭐ 星70の状態から(2ひき・飾りあり)</button>
<button data-d="two">🐾 あと1回保存すると2ひきめが選べる状態にする</button>
<button data-d="three">🐾 あと1回保存すると3びきめが選べる状態にする</button>
<button data-d="mate">👥 あと1回保存するとコアラが来る状態にする</button>
<button data-d="deco">🎁 あと1回保存すると飾りが届く状態にする</button>

<div>流れ:ホーム → 国語 → 3時間め or 4時間め → 保存 → ホーム。<br>ふりかえり欄を空にして保存すると、星は増えません。<br>お部屋の飾りも、なかまも、ホームでそのままドラッグできます。<br>2ひきいるときは、ときどき2ひきで会話します(しばらく待つか、なかまをタップしてみてください)。</div></div>
</div>

const TALK=[['なんだか ほっと するね','うん、ここ すきだな'],['きょうは なにを かこうかな?','ゆっくり かんがえて いいよ'],['おへや あたたかい ね','うん、いい かんじ'],['ねむく なってきた…','すこし やすもうか'],['いっしょに いると たのしいね','うん! いっしょ だね'],['ふりかえり できたら おしえてね','たのしみに してるよ'],['おなか すいた ね','おやつの じかん かな?'],['ねえ ねえ ききたい ことが あるの','なあに? きかせて']];
function chat(){if(!CUR||CUR.chs.length<2)return;if(CUR.chs.some(c=>c.busy||c.ch.querySelector('.say-b')))return;const aw=CUR.chs.filter(c=>c.s.mode!='sleep');if(aw.length<2)return;const pr=aw.slice().sort(()=>Math.random()-.5).slice(0,2).sort((a,b)=>a.s.x-b.s.x),p=pr[0],q=pr[1];
 let i;do{i=Math.floor(Math.random()*TALK.length)}while(i===lastTalk);lastTalk=i;
 [p,q].forEach(c=>{setMode(c,'idle');c.s.t=7});p.s.dir=1;q.s.dir=-1;
 say(p,TALK[i][0]);setTimeout(()=>{if(CUR&&CUR.chs.includes(q)&&q.ch.isConnected)say(q,TALK[i][1])},2300)}
function say(c,txt){if(!c)return;const ch=c.ch;const old=ch.querySelector('.say-b');if(old)old.remove();let i;do{i=Math.floor(Math.random()*SAY.length)}while(i===lastSay);lastSay=i;const s=document.createElement('div');s.className='say-b';s.textContent=txt||SAY[i];ch.appendChild(s);setTimeout(()=>s.remove(),2600)}
(function later(){setTimeout(()=>{if(CUR&&ST.screen=='home'){const a=CUR.chs.filter(c=>!c.busy&&c.s.mode!=='sleep'&&!CUR.chs.some(o=>o.ch.querySelector('.say-b')));if(CUR.chs.length>1&&Math.random()<.6)chat();else if(a.length)say(a[Math.floor(Math.random()*a.length)])}later()},9000+Math.random()*8000)})();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(CUR)CUR.chs.forEach(c=>{const S=c.s;if(c.busy)return;S.t-=dt;
  if(S.mode=='walk'){const dx=S.tx-S.x,dy=S.ty-S.y,d=Math.hypot(dx,dy);if(d<3){setMode(c,'idle');S.t=1.5+Math.random()*3}else{S.x+=dx/d*34*dt;S.y+=dy/d*34*dt;if(Math.abs(dx)>2)S.dir=dx>0?1:-1}}
  else if(S.t<=0){const r=Math.random();if(r<.7){S.tx=CUR.RW*(.12+Math.random()*.76);S.ty=CUR.RH*(.66+Math.random()*.28);setMode(c,'walk')}else if(r<.9&&S.mode!='sleep'){setMode(c,'sleep');S.t=4+Math.random()*3}else{setMode(c,'idle');S.t=2}}
 });
 draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;PH.appendChild(t);setTimeout(()=>t.remove(),1800)}
const ACT={
 pick:a=>{const t=a.dataset.t,i=ST.types.indexOf(t);if(i>=0)ST.types.splice(i,1);else{if(ST.types.length>=SLOTS())ST.types.shift();ST.types.push(t)}render()},
 startOK:()=>{if(ST.types.length<1){toast('1ひき えらんでね');return}ST.screen='home';render()},
 companion:()=>{ST.screen='picker';render()},
 subject:()=>{ST.screen='subject';render()},
 other:()=>toast('見本では 国語だけ ひらけます'),
 write:a=>{ST.n=+a.dataset.n;ST.draft=undefined;ST.screen='write';render()},
 eval:a=>{ST.draft=$('#ta').value;ST.eval=a.dataset.v;render()},
 back:()=>{ST.screen=ST.screen=='write'?'subject':'home';render()},
 save:()=>{const v=$('#ta').value.trim();if(!v){toast('なにか かいてから ほぞんしてね');return}
  const before=nItems(),sb=SLOTS();ST.written[ST.n]=1;ST.stars++;ST.newSlot=SLOTS()>sb;ST.draft=undefined;ST.newIdx=nItems()>before?nItems()-1:-1;const nm=MATES.find(([k,n])=>n>0&&n<=ST.stars&&!ST.seen.includes(k));ST.newMate=nm?nm[0]:null;ST.screen='saved';render()},
 afterSaved:()=>{ST.screen=ST.newIdx>=0?'deco':nextEvent();render()},
 afterDeco:()=>{ST.screen=nItems()>=12?'complete':nextEvent();render()},
 mateNow:()=>{const free=ST.types.length<SLOTS();ST.types.push(ST.newMate);while(ST.types.length>SLOTS())ST.types.shift();ST.seen=unlocked();ST.newMate=null;ST.screen=free?nextEvent():'picker';render()},
 mateLater:()=>{ST.newMate=null;ST.screen=nextEvent();render()},
 slotGo:()=>{ST.newSlot=false;ST.screen='picker';render()},
 theme:a=>{ST.theme=a.dataset.t;ST.roomStart=ST.stars;ST.screen=nextEvent();render()},
 edit:()=>{ST.screen='edit';render()},
 editDone:()=>{ST.screen='home';render()},
 editReset:()=>{LAY=JSON.parse(JSON.stringify(POS));render()}
};
PH.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a)});
document.querySelectorAll('.side [data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d;
 if(d=='reset'){init();ST.screen='picker'}
 if(d=='star'){init();ST.screen='home';ST.first=false;ST.stars=70;ST.roomStart=55;ST.types=['bear','cat'];ST.written={1:1,2:1};ST.seen=unlocked()}
 if(d=='two'){init();ST.screen='home';ST.first=false;ST.stars=59;ST.roomStart=56;ST.seen=unlocked()}
 if(d=='three'){init();ST.screen='home';ST.first=false;ST.stars=129;ST.roomStart=126;ST.types=['bear','cat'];ST.seen=unlocked()}
 if(d=='deco'){init();ST.screen='home';ST.first=false;ST.stars=39;ST.written={1:1,2:1};ST.seen=unlocked()}
 if(d=='mate'){init();ST.screen='home';ST.first=false;ST.stars=84;ST.roomStart=81;ST.types=['bear','cat'];ST.seen=unlocked()}
 if(d=='done'){init();ST.screen='home';ST.first=false;ST.stars=59;ST.written={1:1,2:1,3:1};ST.seen=unlocked()}
 render()});
render();
</script>
