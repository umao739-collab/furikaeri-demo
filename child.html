let CUR=null;const SS=[0,1,2].map(()=>({x:0,y:0,tx:0,ty:0,mode:'idle',t:1,dir:1}));
const LT=[];
function startLetterAnim(){const sc=$('#ls');if(!sc)return;const ch=sc.querySelector('.lch'),env=sc.querySelector('.lenv'),mail=sc.querySelector('.lmail'),msg=$('.lmsg'),T=(f,ms)=>LT.push(setTimeout(f,ms));
 const face=()=>{ch.classList.remove('walk');ch.classList.add('idle');ch.querySelector('.in').style.transform='scaleX(-1)'};
 const fin=()=>{LT.forEach(clearTimeout);LT.length=0;face();ch.style.animation='none';ch.style.left='56%';env.remove();mail.classList.add('got');msg.classList.add('show');sc.onclick=null};
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){fin();return}

 T(()=>{mail.classList.add('got');sc.insertAdjacentHTML('beforeend','<div class="lspark">✨</div>')},4150);
 T(()=>{face();ch.classList.add('jump');for(let i=0;i<3;i++){const h=document.createElement('div');h.className='heart';h.textContent='💗';h.style.left=(20+i*25)+'px';h.style.top='-6px';h.style.animationDelay=i*.12+'s';ch.appendChild(h);setTimeout(()=>h.remove(),1500)}},4400);

 sc.onclick=fin}

function mount(room,edit,newIdx){
 room.insertAdjacentHTML('afterbegin',BG[ST.room]);
 room.style.position='relative';
 const RW=room.clientWidth,RH=room.clientHeight;
 const n=nItems(),sc=Math.max(1,RH/250);
 for(let i=0;i<n;i++){const it=IT()[i],d=document.createElement('div');d.className='it'+(i==newIdx?' new':'');d.style.width=it.w*sc*(ST.room=='house'?1:.8)+'px';d.innerHTML=it.svg;d.dataset.i=i;placeIt(d,LAY[ST.room][i][0],LAY[ST.room][i][1],it);room.appendChild(d)}
 CUR={room,RW,RH,chs:[]};
 ST.types.forEach((t,i)=>{const s=SS[i],ch=document.createElement('div');ch.className='ch idle';ch.dataset.ci=i;ch.style.width=84*sc+'px';ch.innerHTML='<div class="in">'+charSVG(t)+'</div>';room.appendChild(ch);
  if(!s.x||s.x>RW)s.x=RW*({1:[.5],2:[.32,.68],3:[.2,.5,.8]}[ST.types.length][i]);s.y=Math.max(RH*.66,Math.min(RH*.94,s.y||RH*[.92,.86,.9][i]));s.mode='idle';s.t=1+i*1.3;
  CUR.chs.push({ch,s,busy:false})});
 const tap=c=>{setMode(c,'idle');c.s.t=2;c.ch.classList.add('jump');setTimeout(()=>c.ch.classList.remove('jump'),600);const nw=Date.now();c.taps=(c.taps||[]).filter(t=>nw-t<2500);c.taps.push(nw);let tl;if(c.taps.length>=3&&nw>(c.cool||0)){tl=pick('renzoku',RENZOKU);c.taps=[];c.cool=nw+4000}else tl=pick('tap',TAPALL);say(c,tl);for(let i=0;i<3;i++){const h=document.createElement('div');h.className='heart';h.textContent='💗';h.style.left=(20+i*25)+'px';h.style.top='-6px';h.style.animationDelay=i*.12+'s';c.ch.appendChild(h);setTimeout(()=>h.remove(),1500)}};
 if(edit){
  room.classList.add('dragon');
  let c=null,cc=null,sx=0,sy=0,moved=false;
  room.addEventListener('pointerdown',e=>{const t=e.target.closest('.it,.ch');if(!t)return;c=t;cc=t.classList.contains('ch')?CUR.chs[+t.dataset.ci]:null;moved=false;sx=e.clientX;sy=e.clientY;t.setPointerCapture(e.pointerId);e.preventDefault()});
  room.addEventListener('pointermove',e=>{if(!c)return;
