<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E8EEE6;color:#3a3a35;font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Meiryo',sans-serif;font-weight:500;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 60px}
.wrap{max-width:1040px;margin:0 auto}
.demo{background:#3a3a35;color:#fff;border-radius:14px;padding:8px 14px;font-size:12px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.demo button{margin-left:auto;background:#fff;color:#3a3a35;border:0;border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}
.win{border-radius:26px;background:linear-gradient(180deg,#FFF6DD,#FCE9D4);box-shadow:0 8px 26px rgba(0,0,0,.14);padding:14px 18px 22px;min-height:70vh}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.logo{font-weight:900;font-size:15px;color:#C24F28;cursor:pointer}
.rt{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mini{background:#fff;border:0;border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;font-weight:900;color:#C24F28;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer}
.who{background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.greet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mas{width:38px;flex:none}
.bub{background:#fff;border-radius:18px 18px 18px 4px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.bub b{color:#C24F28}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border-radius:999px;padding:5px 13px;font-size:12px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.07)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cls{background:#fff;border-radius:20px;padding:10px 12px;box-shadow:0 5px 0 rgba(0,0,0,.08);min-width:0}
.cls h3{margin:0 0 4px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.cls h3 small{font-size:11px;font-weight:700;color:#8a6a2b;background:#FFF0C2;border-radius:999px;padding:2px 9px}
.sj{display:flex;align-items:center;gap:8px;border-radius:12px;padding:6px 10px;margin-top:4px;font-weight:900;font-size:13px;cursor:pointer;transition:transform .15s;border:0;width:100%;font-family:inherit;text-align:left;color:inherit}
.sj:hover{transform:translateY(-2px)}
.sj small{margin-left:auto;font-size:11px;font-weight:700;opacity:.85}
.bd{background:#FF5A5F;color:#fff;border-radius:999px;font-size:10px;padding:1px 8px;font-weight:900}
.botrow{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-top:10px}
@media(max-width:720px){.botrow{grid-template-columns:1fr}}
.card{background:#fff;border-radius:20px;padding:12px 16px;margin-top:10px;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.botrow .card{margin-top:0}
.lbl{font-size:12px;font-weight:900;color:#C24F28;margin-bottom:4px}
.ttl{font-size:15px;font-weight:900;color:#C24F28;margin-bottom:6px}
.fld{display:flex;flex-direction:column;gap:3px;margin-top:8px;min-width:0}
.addrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.addrow .fld{flex:1;min-width:100px;margin-top:2px}
input[type=text],input[type=date],select,textarea{width:100%;background:#FFFBF0;border:2px solid #F3E2BC;border-radius:14px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;color:#3a3a35}
textarea{line-height:1.6;resize:vertical;font-weight:500}
input:focus,select:focus,textarea:focus{outline:2px solid #E8734A;outline-offset:1px}
.btn{border:0;border-radius:16px;padding:9px 18px;font:inherit;font-weight:900;font-size:13px;box-shadow:0 4px 0 rgba(0,0,0,.12);background:#E8734A;color:#fff;cursor:pointer}
.btn.w{background:#fff;color:#C24F28}.btn.sm{padding:4px 12px;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.1)}.btn.red{color:#b33}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.back{background:#fff;border:0;border-radius:999px;padding:5px 14px;font:inherit;font-size:12px;font-weight:900;color:#C24F28;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.hd{display:flex;align-items:center;gap:10px;margin:4px 0 8px;flex-wrap:wrap}
.hd h2{margin:0;font-size:20px;font-weight:900}
.pill{background:#FFD9D9;color:#C24F28;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:900}
.hd select{width:auto;min-width:180px}
.tabs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.tab{flex:1 1 120px;text-align:center;border-radius:16px;padding:9px 6px;font:inherit;font-size:14px;font-weight:900;background:rgba(255,255,255,.6);box-shadow:0 3px 0 rgba(0,0,0,.06);position:relative;border:0;cursor:pointer;color:#3a3a35}
.tab.on{background:#fff;color:#C24F28;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.tab .bd{position:absolute;top:-7px;right:6px}
.per{display:flex;gap:6px;flex-wrap:wrap}
.per button{min-width:42px;text-align:center;border-radius:12px;padding:6px 10px;background:#FFF1E6;font:inherit;font-weight:900;font-size:13px;position:relative;border:0;cursor:pointer;color:#3a3a35}
.per button.on{background:#E8734A;color:#fff}
.per .bd{position:absolute;top:-8px;right:-6px;font-size:9px;padding:0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 8px;border-bottom:1px dashed #eadfc9}
.row:last-child{border:0}
.row.pend{background:#FFF4EE;border-radius:16px;border-bottom:0;margin-bottom:4px}
.row.abs{opacity:.55}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:none}
.rb{min-width:0;flex:1}
.nm{font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tx{font-size:13px;line-height:1.7;margin-top:2px}
.cnt{font-size:11px;color:#8a8a80;margin-left:6px}
.st{font-size:11px;font-weight:900;border-radius:999px;padding:2px 10px}
.st.p{background:#FF5A5F;color:#fff}.st.d{background:#DFF3DC;color:#3d7a35}.st.n{background:#eee;color:#888}
.ab{font-size:12px;font-weight:700;color:#8a6a2b;display:flex;align-items:center;gap:4px;cursor:pointer}
.cm{font-size:12.5px;background:#F3F8EE;border-radius:12px;padding:6px 10px;margin-top:6px;line-height:1.7}
.hint{font-size:12px;color:#7a7a6a;line-height:1.7;margin:4px 0 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.stp{background:#FFF6EE;border-radius:16px;padding:10px 12px;font-size:12.5px;line-height:1.7;display:flex;flex-direction:column;align-items:flex-start}
.stp b{font-size:13.5px;color:#C24F28}
.warn{border:2px solid #F2C14E}
.pr{border:1px solid #F0E2C8;border-radius:16px;padding:10px 12px;margin-top:10px;background:#FFFCF5}
.prh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.mini2{background:#FFF0C2;border-radius:999px;padding:1px 10px;font-size:11px;font-weight:900}
.pg{display:flex;gap:6px;flex-wrap:wrap}.pg button{border:0;border-radius:12px;padding:5px 12px;background:#FFF1E6;font:inherit;font-weight:900;font-size:13px;cursor:pointer;color:#3a3a35}.pg button.on{background:#E8734A;color:#fff}
.gd{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:6px}
.gc{background:#FFF1E6;border-radius:16px;padding:10px 12px;font-size:12.5px;line-height:1.6;display:flex;flex-direction:column;gap:2px}.gc b{font-size:13.5px}.gc.w{background:#fff;border:1px solid #F0E2C8}
.demo-box{border:2px dashed #E8C7A8;border-radius:16px;height:80px;display:flex;align-items:center;justify-content:center;color:#a98;font-size:13px;background:#FFFBF0}
.det{margin-top:12px;border:2px dashed #E8C7A8;border-radius:16px;padding:6px 14px}
.det summary{cursor:pointer;font-size:13px;color:#8a6a2b;font-weight:700;padding:6px 0}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;margin-top:10px;cursor:pointer}
.chk input{width:auto}
.tl{border-left:3px solid #F3C7B4;margin:8px 0 0 8px;padding-left:14px}
.tl .it{margin-bottom:12px;position:relative}
.tl .it:before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:#E8734A}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:rgba(50,45,40,.92);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;z-index:99;max-width:90vw}
.rev{border:2px solid #F3E2BC;border-radius:16px;padding:10px 12px;margin-top:12px;background:#FFFCF5}
.rev .it{background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:8px}
</style>
<div class="wrap">
 <div class="demo">🧪 操作デモです。表示されている児童や文章は、すべて見本用の作り物です。保存はされません。<button data-act="reset">最初の状態に戻す</button></div>
 <div class="win" id="app"></div>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAMES=['さくら','はると','みお','そうた','ゆい','りく','あおい','ひなた'];
const AVC=['#FFD9D9','#D9ECFF','#DFF3DC','#FFF0C2','#E3D9FA','#FFE3D0','#D8F0F0','#F8DDF0'];
const SUBJ={'国語':['📕','#FFD9D9'],'算数':['🔢','#D9ECFF'],'理科':['🌱','#DFF3DC'],'外国語':['🔤','#E3D9FA'],'音楽':['🎵','#FFF0C2'],'家庭科':['🧵','#FFE3D0'],'社会':['🌏','#FDEBC8'],'体育':['🏃','#D8F0F0'],'図工':['🎨','#F8DDF0'],'道徳':['💛','#FFF3B8']};
const MULTI=['専科','教科担任制','特別支援','通級'];
const ALLCLS=['4年1組','4年2組','5年1組','6年1組'];
const G=['今日の学習で分かったことをノートにまとめた。','友達の考えを聞いて、新しい発見があった。','むずかしかったけど、最後まで考えられた。','もっと詳しく調べてみたいと思った。','前の授業とつながっていると気づいた。','先生の説明がよく分かった。','自分の考えを言葉にできた。','次は自分から発表したい。'];
const CM=['分かったことを自分の言葉でまとめられていますね。次も続けてみましょう。','友達の考えから学べたことがすてきです。','むずかしくても最後まで考えた姿勢がよいですね。','調べてみたい気持ちを大切にしてください。','つながりに気づけたのがよいですね。','説明をしっかり聞けていました。','自分の考えを言葉にできていて、よいですね。','次の発表を楽しみにしています。'];
const T3=['ごんが兵十につぐないをするところで、ごんのさみしさがわかった。','ごんは本当はやさしいきつねだと思った。','ごんの気持ちが少しむずかしかった。','兵十に栗をとどけたところが好きです。','ごんの気持ちになって考えてみた。','','','ごんと兵十がわかり合えたらよかったのにと思った。'];
const E=['◎','○','△','◎','○','','','○'];
let S,D;
function mkPeriod(date,goal){return{date,goal,eval:true,format:'しるし',point:'',links:'',check:false,peer:true,peerMode:'匿名',progress:false}}
function genRecs(pend,seed){const o=[];NAMES.forEach((n,i)=>{const t=G[(i+seed)%8];o.push({name:n,reflection:t,eval:['◎','○','△'][(i+seed)%3],comment:pend.includes(i)?'':CM[(i+seed)%8],absent:false,link:''})});return o}
function initData(){
 D={classes:[{cls:'4年1組',subject:'国語',role:'担任'},{cls:'4年1組',subject:'算数',role:'担任'},{cls:'4年1組',subject:'理科',role:'担任'},{cls:'4年2組',subject:'外国語',role:'専科'},{cls:'4年2組',subject:'音楽',role:'専科'},{cls:'5年1組',subject:'家庭科',role:'専科'}],units:{},prompts:[
  {name:'共通・基本のコメント',subject:'',grades:[],purpose:'励ましを中心に、50〜80文字で返す',owner:'田中先生',shared:true,body:'あなたは小学校の先生です。児童のふりかえりに、励ましを中心に50〜80文字でコメントを返してください。'},
  {name:'家庭科用のコメント',subject:'家庭科',grades:['5年','6年'],purpose:'技能面と生活への活用の視点',owner:'佐藤先生',shared:true,body:'あなたは家庭科の先生です。技能面と、生活への活用の視点を入れて、50〜80文字でコメントを返してください。'},
  {name:'低学年向け・やさしい言葉',subject:'',grades:['1年','2年','3年'],purpose:'ひらがな多めで、短く',owner:'あなた',shared:false,body:'あなたは小学校低学年の担任です。ひらがなを多めに、30〜50文字のやさしい言葉で、がんばりを見つけてコメントを返してください。'}],removed:[]};
 const k1='4年1組|国語';
 const r1={1:genRecs([],0),2:genRecs([],1),3:NAMES.map((n,i)=>({name:n,reflection:T3[i],eval:E[i],comment:[3,4,7].includes(i)?CM[i]:'',absent:i==6,link:i==0?'スライド':''})),4:NAMES.map(n=>({name:n,reflection:'',eval:'',comment:'',absent:false,link:''}))};
 D.units[k1]=[{name:'ごんぎつね',goals:'',periods:[mkPeriod('2026-10-21','物語のじょうけいをつかもう'),mkPeriod('2026-10-23','ごんのぎもんを見つけよう'),mkPeriod('2026-10-28','ごんの気持ちを考えよう'),mkPeriod('2026-10-30','ごんと兵十の関係をまとめよう')],recs:r1}];
 D.units['4年2組|外国語']=[{name:'Unit 4',goals:'',periods:[mkPeriod('2026-10-14','数をたずねよう'),mkPeriod('2026-10-28','ものの数を答えよう')],recs:{1:genRecs([],2),2:genRecs([0,1],3)}}];
 [['4年1組|算数','わり算'],['4年1組|理科','ものの温度'],['4年2組|音楽','合奏'],['5年1組|家庭科','ミシン']].forEach(([k,u],j)=>{D.units[k]=[{name:u,goals:'',periods:[mkPeriod('2026-10-16','学習のめあて1'),mkPeriod('2026-10-23','学習のめあて2')],recs:{1:genRecs([],j),2:genRecs([],j+1)}}]});
}
function initLetters(){D.letterOn=false;D.letters=[
 {id:1,from:'さくら',cls:'4年1組',date:'10/30',daysAgo:1,kind:'reply',read:false,reply:'',text:'さいきん、ともだちと うまく はなせなくて、すこし さみしい です。'},
 {id:2,from:'みお',cls:'4年1組',date:'10/28',daysAgo:3,kind:'listen',read:false,reply:'',text:'きょう、おなかが いたく なって、きゅうしょくが たべられませんでした。ちょっと しんぱい です。'},
 {id:3,from:'そうた',cls:'4年1組',date:'10/25',daysAgo:6,kind:'reply',read:false,reply:'',text:'ひるやすみに ドッジボールに いれて もらえなくて かなしかった。'},
 {id:4,from:'ゆい',cls:'4年1組',date:'10/20',daysAgo:11,kind:'reply',read:true,reply:'おしえてくれて ありがとう。また いつでも かいてね。',text:'ピアノの はっぴょうかいが きんちょうする。'}]}
function reset(){initData();initLetters();S={view:'home',key:null,tab:'goal',ui:0,period:1,manual:false,drafts:{},gem:'',pasted:'',review:null,detail:false,addRole:'担任',addClasses:['4年2組'],addClass:'4年2組',addSubject:'算数',confirm:null,confL:false,q:'',fs:'',fg:'',pquery:'',pform:{name:'',subject:'',grades:[],purpose:'',body:'',shared:false},editP:null,stu:0,newUnit:'',copySrc:'',ask:'',askOut:'',confirmP:null,help:null,lastP:{},std:{},openL:null,replyText:''}}
reset();
const keyOf=c=>c.cls+'|'+c.subject;
const unitsOf=k=>D.units[k]||(D.units[k]=[{name:'（単元を作成してください）',goals:'',periods:[mkPeriod('','')],recs:{}}]);
const curUnit=()=>unitsOf(S.key)[Math.min(S.ui,unitsOf(S.key).length-1)];
const recsOf=(u,p)=>{if(!u.recs[p])u.recs[p]=NAMES.map(n=>({name:n,reflection:'',eval:'',comment:'',absent:false,link:''}));return u.recs[p]};
const isPend=r=>!r.absent&&r.reflection&&!r.comment;
const pendOfUnit=u=>Object.keys(u.recs).reduce((a,p)=>a+u.recs[p].filter(isPend).length,0);
const pendOfKey=k=>(D.units[k]||[]).reduce((a,u)=>a+pendOfUnit(u),0);
const unreadL=()=>(D.letters||[]).filter(l=>!l.read).length;
const pendTotal=()=>D.classes.reduce((a,c)=>a+pendOfKey(keyOf(c)),0);
function toast(m){const t=document.getElementById('toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',2400)}
function clip(text){try{navigator.clipboard.writeText(text).then(()=>toast('コピーしました'),()=>toast('コピーできませんでした。下の欄から全選択してください'))}catch(e){toast('コピーできませんでした。下の欄から全選択してください')}}

 const pt=pendTotal();
 const byCls={};D.classes.forEach(c=>(byCls[c.cls]=byCls[c.cls]||[]).push(c));
 const clsNames=Object.keys(byCls).sort();

 copyAsk:()=>{if(!S.ask.trim()){toast('質問を入力してください');return}S.askOut='あなたは「ふりかえりシート」というアプリの使い方に詳しいサポート担当です。\n以下のアプリの説明を参考に、先生からの質問に、分かりやすく丁寧に答えてください。\n説明から分からないことは、想像で答えず「この資料からは分かりません」と答えてください。\n\n【アプリの説明】(ここにアプリの説明が入ります)\n\n【先生からの質問】\n'+S.ask;clip(S.askOut);render()}

document.getElementById('app').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){A[a.dataset.act](a.dataset);return}const s=e.target.closest('[data-sel]');if(s)s.select()});
document.querySelector('.demo').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a.dataset)});
const IN={
 addRole:v=>{S.addRole=v;render()},addClass:v=>S.addClass=v,addSubject:v=>S.addSubject=v,
 unit:v=>{S.ui=+v;S.period=1;render()},
 pdate:v=>P().date=v,pgoal:v=>P().goal=v,ppoint:v=>P().point=v,plinks:v=>P().links=v,ppeermode:v=>P().peerMode=v,pformat:v=>P().format=v,
 peval:(v,el)=>{P().eval=el.checked;render()},pcheck:(v,el)=>P().check=el.checked,ppeer:(v,el)=>{P().peer=el.checked;S.detail=true;render()},pprog:(v,el)=>P().progress=el.checked,
 absent:(v,el)=>{recsOf(curUnit(),S.period)[+el.dataset.i].absent=el.checked;S.review=null;render()},
 draft:(v,el)=>S.drafts[el.dataset.i]=v,editText:v=>S.editText=v,pasted:v=>{S.pasted=v;const b=document.querySelector('[data-act=parse]');if(b)b.disabled=!v},
 rev:(v,el)=>S.review[+el.dataset.i].feedback=v,
 newUnit:v=>S.newUnit=v,copySrc:v=>{S.copySrc=v;render()},goals:v=>curUnit().goals=v,
 pquery:v=>{S.pquery=v;render();const i=document.querySelector('[data-in=pquery]');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},fs:v=>{S.fs=v;render()},fg:v=>{S.fg=v;render()},
 editPBody:v=>S.editPBody=v,replyText:v=>S.replyText=v,pickp:v=>{S.lastP[S.key]=v;S.gem='';render()},pf_name:v=>S.pform.name=v,pf_subject:v=>S.pform.subject=v,pf_purpose:v=>S.pform.purpose=v,pf_body:v=>S.pform.body=v,ask:v=>S.ask=v
};
const SELECTS=['addRole','addClass','addSubject','unit','copySrc','fs','fg','pformat','ppeermode','pf_subject','pickp'];
const CHECKS=['peval','pcheck','ppeer','pprog','absent'];
document.getElementById('app').addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k||!IN[k])return;if(SELECTS.includes(k)||CHECKS.includes(k))return;IN[k](e.target.value,e.target)});
document.getElementById('app').addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k||!IN[k])return;if(SELECTS.includes(k)||CHECKS.includes(k))IN[k](e.target.value,e.target)});
document.getElementById('app').addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.det)S.detail=e.target.open},true);
render();
</script>
</html>
